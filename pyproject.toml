[project]
name = "finalproject-yaroshchuk-m-26-555"
version = "0.1.0"
description = "Currency trade imitation program"
readme = "README.md"
authors = [
    { name = "Vladislav Yaroshchuk", email = "yva0906@yandex.com" }
]

requires-python = ">=3.12"
dependencies = [
    "prettytable>=3.18.0",
    "requests>=2.34.2",
]

[project.scripts]
project = "main:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
only-include = ["valutatrade_hub", "main.py"]

[tool.ruff]
line-length = 88
target-version = "py312"
exclude = ["venv", ".venv", "dist", "__pycache__"]

[tool.ruff.lint]
select = ["E", "F", "I"]
ignore = []

[dependency-groups]
dev = [
    "ruff>=0.16.10",
]
